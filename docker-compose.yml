services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ProjetJA}
      MYSQL_USER: ${DB_USERNAME:-projectja}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - projectja

  app:
    image: projectja-app
    build:
      context: ./ProjectJABack
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - storage_private:/var/www/html/storage/app/private
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - projectja

  queue:
    image: projectja-app
    build:
      context: ./ProjectJABack
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      RUN_MIGRATIONS: "false"
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=120
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - storage_private:/var/www/html/storage/app/private
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - projectja

  scheduler:
    image: projectja-app
    build:
      context: ./ProjectJABack
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      RUN_MIGRATIONS: "false"
    command: php artisan schedule:work
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - storage_private:/var/www/html/storage/app/private
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_started
    networks:
      - projectja

  reverb:
    image: projectja-app
    build:
      context: ./ProjectJABack
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      RUN_MIGRATIONS: "false"
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      app:
        condition: service_started
    networks:
      - projectja

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-local-reverb-key}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - storage_public:/var/www/backend/public/storage:ro
    depends_on:
      - app
      - reverb
    networks:
      - projectja

volumes:
  mysql_data:
  storage_public:
  storage_private:
  storage_logs:

networks:
  projectja:
    name: projectja
